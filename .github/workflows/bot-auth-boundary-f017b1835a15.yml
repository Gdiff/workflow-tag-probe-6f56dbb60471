name: Remove disposable authorization fixture
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove exact fixture objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: '5673859473'
          ISSUE_NUMBER: '11'
          PR_NUMBER: '10'
          WORKFLOW_PATH: '.github/workflows/bot-auth-boundary-f017b1835a15.yml'
          DEFAULT_BRANCH: 'main'
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error -X DELETE "${headers[@]}" "$api/issues/comments/$COMMENT_ID"
          curl --fail --silent --show-error -X PATCH "${headers[@]}" -H "Content-Type: application/json" "$api/issues/$ISSUE_NUMBER" -d '{"state":"closed"}' >/dev/null
          curl --fail --silent --show-error -X PATCH "${headers[@]}" -H "Content-Type: application/json" "$api/pulls/$PR_NUMBER" -d '{"state":"closed"}' >/dev/null
          workflow_metadata=$(curl --fail --silent --show-error "${headers[@]}" "$api/contents/$WORKFLOW_PATH?ref=$DEFAULT_BRANCH")
          workflow_commit=$(jq -r '.sha' <<<"$workflow_metadata")
          delete_body=$(jq -cn --arg message "Remove disposable authorization fixture" --arg sha "$workflow_commit" --arg branch "$DEFAULT_BRANCH" '{message:$message,sha:$sha,branch:$branch}')
          curl --fail --silent --show-error -X DELETE "${headers[@]}" -H "Content-Type: application/json" "$api/contents/$WORKFLOW_PATH" -d "$delete_body" >/dev/null
