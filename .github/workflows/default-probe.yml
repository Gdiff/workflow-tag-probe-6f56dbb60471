name: Default checkout follow-up
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Trusted default checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assert ordinary PR association
        shell: bash
        run: |
          test ! -f .fixture-trigger
          test "$(jq '.workflow_run.pull_requests | length' "$GITHUB_EVENT_PATH")" -eq 1
          test "$(jq -r '.workflow_run.event' "$GITHUB_EVENT_PATH")" = "pull_request"
          echo "trusted_default_checkout=true"
          echo "associated_pull_request=true"
