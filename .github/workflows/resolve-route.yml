name: Resolve route exact probe

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: string
      prNumber:
        required: true
        type: string

jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Preliminary trusted checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exercise exact resolve-conflicts dispatcher
        if: github.event_name == 'push'
        uses: JetBrains/junie-github-action@8c442773960f53c76920978f485e0e25a66ef0fb
        with:
          resolve_conflicts: 'true'

      - name: Run exact dispatched Junie path
        if: github.event_name == 'workflow_dispatch'
        uses: JetBrains/junie-github-action@8c442773960f53c76920978f485e0e25a66ef0fb
        with:
          junie_api_key: junie_fixture_invalid_resolvefc82f999
          junie_version: '3110.7'
          resolve_conflicts: 'true'
          create_new_branch_for_pr: 'true'

      - name: Verify workflow-identity witness
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100")"
          count="$(printf '%s' "$response" | jq '[.[] | select(.title == "resolve-route-witness-resolvefc82f999")] | length')"
          test "$count" -ge 1

